[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fjson-local-model-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3", "playwright>=1.50", "Pillow>=11"]
qa = ["playwright>=1.50", "Pillow>=11"]

[project.scripts]
benchctl = "fjson_bench.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
